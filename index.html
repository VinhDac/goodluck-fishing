<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GoodLuck Fishing</title>
  <meta name="description" content="A tired duck, a golden escalator, and a sky full of real jobs to fish. By Vinh Dac.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%228%22 fill=%22%23ffd84a%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/lobby.css">
</head>
<body>
  <main id="stage">
    <canvas id="scene" aria-label="A duck asleep at its desk, late at night. Click the duck."></canvas>
    <!-- the computer's screen: the words in real text, laid over the drawing -->
    <div class="screen" id="screen"><b>Applications sent: 80</b><span>Replies: 1</span></div>
    <div class="hint" id="hint">Click the duck</div>
    <div class="veil" id="sky" hidden>
      <div class="card">
        <h1>The sky</h1>
        <p>Up here every cloud is a real job, just posted. The boat and the clouds come in the next part.</p>
        <button id="down">Back to the office</button>
      </div>
    </div>
  </main>
  <footer>GoodLuck Fishing · by <a href="https://vinhdac.github.io" target="_blank" rel="noopener">Vinh Dac</a></footer>
  <script type="module" src="js/lobby.js"></script>
</body>
</html>
