# THE HARVEST, BY ITSELF (PLAN.md 5 and 7): every six hours, every live company board read (tools/harvest.py); the jobs
# written into Supabase (tools/upload.py), and as static files on the store branch, which the game reads (tools/publish.py;
# Vin, 15/11/2026: «đổi sang cách file tĩnh»). The secret key is the repo's secret, never in the code.
name: harvest

on:
  schedule:
    - cron: "17 */6 * * *"     # 00:17, 06:17, 12:17, 18:17 UTC
  workflow_dispatch: {}         # and on a press, from the Actions tab

concurrency:
  group: harvest
  cancel-in-progress: false

permissions:
  contents: write                 # to replace the store branch

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read every live board
        run: python -u tools/harvest.py
      - name: Write into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -u tools/upload.py
      - name: Write the store as files
        run: python -u tools/publish.py
      - name: Replace the store branch
        run: |
          cd store/out
          git init -q -b store
          git add .
          git -c user.name="goodluck-harvest" -c user.email="actions@users.noreply.github.com" commit -q -m "The job store as files"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" store
