<!doctype html>
<!-- THE LOBBY AS A STILL (PLAN.md 12, F): the room as js/room.js draws it, on a computer and on a phone, for Vin to
     approve before it moves and talks. Open through a local server: python -m http.server, then /tools/still.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lobby, still</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #05060f; display: flex; gap: 24px; padding: 24px; align-items: flex-start; font-family: "Pixelify Sans", monospace; }
  .frame { position: relative; }
  canvas { display: block; image-rendering: pixelated; }
  .bubble { position: absolute; background: #fff8e7; color: #1b1f3a; border: 3px solid #3a2a1a; border-radius: 4px; padding: 6px 10px;
    font-size: 17px; line-height: 1.25; max-width: 260px; box-shadow: 0 3px 0 #3a2a1a; }
  .bubble::after { content: ""; position: absolute; left: 22px; bottom: -11px; border: 8px solid transparent; border-top-color: #3a2a1a; }
  .bubble i { font-style: normal; opacity: .55; }
  .label { color: #8890b8; font: 13px system-ui, sans-serif; margin-top: 6px; }
</style>
</head>
<body>
<div><div class="frame" id="wide"></div><div class="label">A computer: 384 by 216, each pixel 4 by 4</div></div>
<div><div class="frame" id="tall"></div><div class="label">A phone: 195 by 422, each pixel 2 by 2</div></div>
<script type="module">
  import { makeRoom } from '../js/room.js';
  function show(id, W, H, K, say, size) {
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H; cv.style.width = W * K + 'px'; cv.style.height = H * K + 'px';
    document.getElementById(id).appendChild(cv);
    const room = makeRoom(cv.getContext('2d'));
    const L = room.layout(W, H); room.draw(W, H, 0.3, {});
    const b = document.createElement('div'); b.className = 'bubble'; b.innerHTML = say; b.style.fontSize = size + 'px';
    document.getElementById(id).appendChild(b);
    const r = b.getBoundingClientRect();
    const right = L.mcx + L.mon.w / 2 + 6;                         // beside the screen if there is room, else above it
    if ((W - right) * K > r.width + 12) { b.style.left = right * K + 'px'; b.style.top = ((L.deskT - 16) * K - r.height - 12) + 'px'; }
    else { b.style.left = '8px'; b.style.top = ((L.monTop - 4) * K - r.height - 12) + 'px'; }
  }
  show('wide', 384, 216, 4, '<i>zzz…</i> entry level… eight years of experience required… <i>zzz</i>', 17);
  show('tall', 195, 422, 2, '<i>zzz…</i> yes… I am a team player… <i>zzz</i>', 14);
</script>
</body>
</html>
