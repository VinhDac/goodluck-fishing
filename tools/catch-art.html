<!doctype html>
<!-- THE CATCH'S SPRITES, ENLARGED (PLAN.md 19): the float and the CV under it, the «!», the mailbag, the reel's panel with its
     cloud and the letter of each kind at each beat, a stamp, the bow of a perfect catch, the duck holding a letter up; to
     check each pixel. /tools/catch-art.html?s=8 -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>The catch, sprites</title>
<style>
  body { margin: 0; background: #0c0f24; color: #c9d0ff; font: 13px system-ui, sans-serif; padding: 12px; }
  canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
  import { makePix } from '../js/pix.js';
  import { art } from '../js/sky.js';
  import { upright } from '../js/ducks.js';
  import { PANEL } from '../js/letters.js';
  const S = +(new URLSearchParams(location.search).get('s') || 7);
  const W = 190, H = 110, c = document.getElementById('c'), g = c.getContext('2d');
  c.width = W; c.height = H; c.style.width = `${W * S}px`; c.style.height = `${H * S}px`;
  const px = makePix(g);
  for (let i = 0; i < 12; i++) px.R(0, (i * H) / 12, W, H / 12 + 1, `rgb(${[86 + i * 8, 150 + i * 5, 220 + i * 2]})`);
  // the float, the CV under it, the «!»
  art.floatArt(px, 8, 12); px.R(8, 15, 1, 3, 'rgba(255,255,255,0.7)'); art.baitArt(px, 8, 18);
  art.bangArt(px, 24, 22);
  // the mailbag, as it is and puffed, with a count
  art.bagArt(px, 42, 10, 7, false); art.bagArt(px, 60, 10, 123, true);
  // a stamp, a bow
  art.stampArt(px, 74, 6); art.bowArt(px, 88, 10);
  // the reel's panel, its cloud, the letter in it
  const P = PANEL, ox = 100, oy = 4, kpx = makePix(g);
  const pc = document.createElement('canvas'); pc.width = P.w + 1; pc.height = P.h + 2; art.panelArt(makePix(pc.getContext('2d')), P.w, P.h, P.lane, P.ribbon, P.pad); g.drawImage(pc, ox, oy);
  const cc = document.createElement('canvas'); cc.width = P.lane; cc.height = 28; art.reelCloudArt(makePix(cc.getContext('2d')), P.lane, 28); g.drawImage(cc, ox + P.pad, oy + P.pad + 40);
  art.miniLetterArt(kpx, ox + P.pad + P.lane / 2, oy + P.pad + 52, 'plain', 1);
  px.R(ox + P.pad + P.lane + 2, oy + P.pad + 50, P.ribbon, 34, '#ffd84a');
  // the letter in the panel, each kind, each beat
  ['plain', 'gold', 'old', 'unread', 'gull'].forEach((k, i) => { for (let f = 0; f < 3; f++) art.miniLetterArt(px, 140 + f * 16, 10 + i * 12, k, f); });
  // the duck sitting, and holding a letter up
  upright(px, 30, 100, { sit: true });
  upright(px, 70, 100, { sit: true, cheer: true }); art.letterArt(px, 73, 69, 'big', 'plain', -1);
  upright(px, 110, 100, { sit: true, cheer: true }); art.letterArt(px, 113, 69, 'gold', 'gold', -1); art.bowArt(px, 108, 66);
</script>
</body>
</html>
