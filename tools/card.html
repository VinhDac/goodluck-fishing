<!doctype html>
<!-- THE SHARE CARD AND THE MOVING PICTURE (PLAN.md 20 E and F): the sky of letters as the game draws it, the duck fishing by
     itself, with made-up jobs and a made-up CV, the same every time (a seeded chance), at a moment the address chooses:
       /tools/card.html?card&at=30      the share card, with the title over it (img/card.png, 1200 × 630)
       /tools/card.html?at=12.5         the sky at 12.5 seconds, nothing over it: a frame of the moving picture (img/play.gif)
       /tools/card.html?log             what the duck is doing, second by second, to choose the moments
     tools/card.py opens it in Chrome with no window and keeps the pictures. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>GoodLuck Fishing card</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --paper: #fff8e7; --yellow: #ffd84a; --ui: "Pixelify Sans", ui-monospace, monospace; }
  *, *::before, *::after { font-variant-ligatures: none !important; font-feature-settings: "liga" 0, "clig" 0 !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0f24; }
  canvas { display: block; }
  .title { position: fixed; right: 4.5%; top: 9%; width: 56%; text-align: center; padding: 14px 10px 18px;
    background: radial-gradient(ellipse at center, rgba(12, 15, 36, .5), rgba(12, 15, 36, 0) 70%); }
  .title[hidden] { display: none; }
  .title h1 { margin: 0; font: 700 clamp(30px, 7.2vw, 92px)/1.02 var(--ui); color: var(--yellow); text-transform: uppercase; letter-spacing: .03em;
    text-shadow: 4px 0 0 #6b3f10, -4px 0 0 #6b3f10, 0 4px 0 #6b3f10, 0 -4px 0 #6b3f10, 4px 4px 0 #6b3f10, -4px 4px 0 #6b3f10, 4px -4px 0 #6b3f10, -4px -4px 0 #6b3f10, 0 10px 0 #2a1808; }
  .title p { margin: 18px 0 8px; font: 600 clamp(14px, 2.4vw, 30px)/1.3 var(--ui); color: var(--paper); text-shadow: 0 3px 0 #1b1f3a, 0 0 12px rgba(12, 15, 36, .6); }
  .title .by { font: 600 clamp(12px, 1.6vw, 20px) var(--ui); color: var(--paper); opacity: .92; text-shadow: 0 2px 0 #1b1f3a; }
  #log { position: fixed; left: 8px; top: 8px; font: 12px ui-monospace, monospace; color: #fff; background: rgba(0, 0, 0, .55); white-space: pre; max-height: 96vh; overflow: auto; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="title" id="title" hidden>
  <h1>GoodLuck Fishing</h1>
  <p>A calm fishing game. The letters are real jobs.</p>
  <div class="by">by Vinh Dac · play in your browser</div>
</div>
<div id="log" hidden></div>
<script type="module">
  import { makeStage } from '../js/stage.js';
  import { makeSky } from '../js/sky.js';
  import { makeLetters } from '../js/letters.js';
  import { makeCatchUI } from '../js/catchui.js';
  import { fitOf, sizeOf } from '../js/lake.js';

  // a chance that is the same every time (mulberry32), so each picture of a moment is the same picture
  let seed = 0;
  Math.random = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

  const $ = (id) => document.getElementById(id);
  const q = new URLSearchParams(location.search), card = q.has('card'), log = q.has('log'), at = parseFloat(q.get('at') || '0');
  const SKILLS = ['python', 'machine learning', 'pytorch', 'sql', 'aws', 'docker', 'llm', 'nlp', 'deep learning', 'statistics'];
  // made-up companies and jobs: no real names in a picture of the game
  const COS = ['Northwind', 'Bluebird AI', 'Copperleaf', 'Harbor Labs', 'Lumen', 'Quill', 'Tallyho', 'Orbitly', 'Moss & Co', 'Pebble', 'Kite', 'Fable Works'];
  const ASK = ['python', 'sql', 'aws', 'pytorch', 'react', 'golang', 'java', 'kubernetes', 'excel', 'llm', 'nlp', 'docker', 'machine learning', 'statistics'];
  const jobs = Array.from({ length: 60 }, (_, i) => {
    const golden = i % 15 === 1;                                       // now and then one that fits the made-up CV through and through
    const skills = golden ? { python: 3, pytorch: 2, 'machine learning': 3, llm: 1 } : Object.fromEntries(ASK.filter((_, k) => (i * 7 + k * 3) % 5 < 2).map((k) => [k, 1 + (i % 3)]));
    const fit = fitOf(skills, new Set(SKILLS));
    return { id: `card${i}`, company: COS[i % COS.length], title: ['ML Engineer', 'AI Engineer', 'Data Scientist', 'Research Engineer'][i % 4],
      place: 'London', url: '#', posted: Date.now() - (i % 20) * 864e5 - 3600e3, skills, fit, size: sizeOf(fit) };
  });

  const stage = makeStage($('sky'), { tall: card ? 210 : 216 }), sky = makeSky(stage);   // the card: three screen pixels to each, the duck plain to see
  const ui = makeCatchUI({ toCss: (x, y) => ({ x: (x * stage.K) / stage.dpr, y: (y * stage.K) / stage.dpr }), skills: () => new Set(SKILLS) });
  // the moment, drawn from the start every time the window has its size (Chrome with no window settles its size late)
  function render() {
    seed = 16112026;
    const letters = makeLetters({ onSay: () => {}, onBag: () => {}, onAway: () => {} });
    stage.fit(); sky.layout(stage.W, stage.H); letters.resize(stage.W, stage.H);
    letters.start({ W: stage.W, H: stage.H, L: sky.L }, { skills: SKILLS, auto: true, day: 0.3, season: 'autumn', weather: 'fair', level: 2, gullFirst: 999 });
    sky.draw(letters.view());                                          // once, so the city knows where its roofs are
    // the search plays out: the jobs come over the first twelve seconds, as the store's do on the web
    const dt = 1 / 30, lines = [`${innerWidth} x ${innerHeight}`];
    let fed = 0, t = 0, lastPhase = '';
    const end = log ? 90 : at;
    while (t < end - 1e-9) {
      const due = Math.min(jobs.length, Math.floor((jobs.length * t) / 12) + 4);
      while (fed < due) letters.feed(jobs[fed++]);
      if (fed >= jobs.length && letters.F.waiting) letters.searchDone();
      letters.step(dt); t += dt;
      if (log) {
        const k = letters.F.line, ph = k ? k.phase : '', sh = letters.F.show ? `show ${letters.F.show.tier}` : '';
        const now = `${ph}${sh ? ` ${sh}` : ''}`;
        if (now !== lastPhase) { lines.push(`${t.toFixed(2)}s ${now || 'idle'}${k && k.suitor ? ` (${k.suitor.job.size})` : ''}`); lastPhase = now; }
      }
    }
    const v = letters.view();
    sky.draw(v);
    ui.update(v);
    if (log) { $('log').hidden = false; $('log').textContent = lines.join(String.fromCharCode(10)); }
  }
  let size = '';
  function settle() { const now = `${innerWidth}x${innerHeight}`; if (now === size) return; size = now; render(); }
  addEventListener('resize', settle);
  settle();
  if (card && !log) $('title').hidden = false;
  await document.fonts.ready;
  setTimeout(() => { settle(); document.title = 'ready'; }, 300);
</script>
</body>
</html>
