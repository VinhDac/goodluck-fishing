<!doctype html>
<!-- THE LETTERS' SPRITES, ENLARGED (PLAN.md 18): every kind and size of letter at every beat of its wings, the opened letter
     with its stamp, the gull's frames, its airmail letter, the name tag; to check each pixel. /tools/letters-art.html?s=8 -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Letters, sprites</title>
<style>
  body { margin: 0; background: #0c0f24; color: #c9d0ff; font: 13px system-ui, sans-serif; padding: 12px; }
  canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
  import { makePix } from '../js/pix.js';
  import { art } from '../js/sky.js';
  const S = +(new URLSearchParams(location.search).get('s') || 8);
  const W = 176, H = 118, c = document.getElementById('c'), g = c.getContext('2d');
  c.width = W; c.height = H; c.style.width = `${W * S}px`; c.style.height = `${H * S}px`;
  const px = makePix(g);
  // the sky behind them, as at mid morning
  for (let i = 0; i < 12; i++) px.R(0, (i * H) / 12, W, H / 12 + 1, `rgb(${[86 + i * 8, 150 + i * 5, 220 + i * 2]})`);
  const kinds = ['plain', 'gold', 'old', 'unread'], sizes = { plain: ['small', 'medium', 'big'], gold: ['gold'], old: ['medium'], unread: ['unread'] };
  let y = 8;
  for (const k of kinds) for (const s of sizes[k]) {
    for (let f = 0; f < 5; f++) art.letterArt(px, 14 + f * 26, y, s, k, f);
    y += 13;
  }
  art.openedArt(px, 152, 14, 'plain', 0); art.openedArt(px, 152, 40, 'plain', 1);
  for (let f = 0; f < 5; f++) art.gullArt(px, 12 + f * 22, y + 8, f);
  art.airmailArt(px, 150, 66);
  art.tagArt(px, 40, 106, 'WAYVE');
  px.P(100, 104, '#c8ccd8'); px.R(100, 105, 1, 3, '#eef1f7'); px.P(99, 107, '#eef1f7'); px.R(99, 108, 2, 1, '#aab0c2');   // the hook
</script>
</body>
</html>
