<!doctype html>
<!-- ONE CATCH, TO TRY (PLAN.md 19, step 1): the sky of letters with the new way of catching, alone: hold anywhere and let go
     to cast; wait while a letter comes round the CV; press when it bites; hold and let go to keep the letter in the little
     cloud until the ribbon is full; the duck holds it up, its tag over it (press the tag for the rest), and into the bag
     it goes. A tap on the duck lets it fish by itself. «Try a catch» shows each kind of catch at once. The jobs are the
     shared store's, for a made-up CV (an AI engineer in London, two made-up dream companies); the search plays out in
     about a minute. Open through a local server: /tools/catch.html (?debug: window.sky, and the time a frame takes) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One catch</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --paper: #fff8e7; --ink: #1b1f3a; --edge: #3a2a1a; --yellow: #ffd84a; --ui: "Pixelify Sans", ui-monospace, monospace; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0f24; }
  canvas { display: block; touch-action: none; -webkit-user-select: none; user-select: none; }
  .hud { position: fixed; font: 600 14px var(--ui); color: var(--paper); }
  .prog { top: 10px; right: 10px; display: flex; align-items: center; gap: 10px; background: rgba(27, 31, 58, 0.62); border-radius: 4px; padding: 5px 10px 7px; }
  .prog .line { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .prog .bar { height: 2px; background: rgba(255, 255, 255, 0.18); border-radius: 2px; overflow: hidden; }
  .prog .bar i { display: block; height: 100%; width: 0; background: var(--yellow); transition: width 0.4s linear; }
  .prog button { all: unset; cursor: pointer; font: 600 13px var(--ui); color: #c9d0ff; }
  .talk { left: 10px; bottom: 66px; max-width: min(420px, calc(100vw - 20px)); color: var(--ink); background: rgba(255, 248, 231, 0.92); border-radius: 4px;
    padding: 5px 10px; font: 14px/1.3 var(--ui); opacity: 0; transform: translateY(6px); transition: opacity 0.3s, transform 0.3s; pointer-events: none; }
  .talk.show { opacity: 1; transform: none; }
  .hint { left: 50%; bottom: 12px; transform: translateX(-50%); font: 13px var(--ui); color: #fff8e7; text-shadow: 0 1px 2px rgba(0,0,0,.6); white-space: nowrap; transition: opacity 1s; pointer-events: none; }
  .try { left: 10px; bottom: 34px; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; font: 12px var(--ui); color: #c9d0ff; }
  .try button { font: 600 12px var(--ui); color: var(--ink); background: var(--paper); border: 2px solid var(--edge); border-radius: 3px; padding: 2px 7px; cursor: pointer; }
  .perf { left: 10px; top: 10px; font: 12px ui-monospace, monospace; color: #c9d0ff; background: rgba(0, 0, 0, 0.4); padding: 3px 6px; }
  @media (max-width: 560px) { .hint { bottom: 8px; font-size: 11px; white-space: normal; width: 90vw; text-align: center; } .try { bottom: 44px; } .talk { bottom: 96px; } .prog { left: 10px; right: 10px; } }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="hud prog"><div class="line"><span id="progText">Getting ready…</span><div class="bar"><i id="progBar"></i></div></div><button id="sound" type="button" title="Sound">♪ off</button></div>
<div class="hud talk" id="talk"></div>
<div class="hud hint" id="hint">Hold anywhere, let go to cast · press when it bites · hold to lift the cloud · tap the duck to let it fish</div>
<div class="hud try" id="try">Try a catch:</div>
<div class="hud perf" id="perf" hidden></div>
<script type="module">
  import { makeStage } from '../js/stage.js';
  import { makeSky } from '../js/sky.js';
  import { makeLetters } from '../js/letters.js';
  import { makeCatchUI } from '../js/catchui.js';
  import { readLake } from '../js/lake.js';
  import { sfx, soundOn, setSound } from '../js/sound.js';

  const $ = (id) => document.getElementById(id);
  const debug = new URLSearchParams(location.search).has('debug');
  const ME = { titles: ['machine learning engineer', 'ai engineer', 'data scientist', 'software engineer'], city: 'london', remote: true,
    skills: ['python', 'machine learning', 'pytorch', 'sql', 'aws', 'docker', 'llms', 'nlp', 'deep learning', 'tensorflow', 'kubernetes', 'react', 'typescript'] };

  const stage = makeStage($('sky'));
  const sky = makeSky(stage);
  let talkTimer = 0;
  function say(text, who, secs = 3) {
    const t = $('talk'); t.textContent = text; t.classList.add('show');
    clearTimeout(talkTimer); talkTimer = setTimeout(() => t.classList.remove('show'), secs * 1000);
  }
  const letters = makeLetters({
    onSay: say,
    onBag: () => { $('hint').style.opacity = '0'; },
    onAway: () => {},
    // a made-up check for this page: about one posting in nine has closed
    onCheck: (job) => new Promise((ok) => setTimeout(() => ok([...String(job.id)].reduce((n, c) => (n * 31 + c.charCodeAt(0)) % 997, 7) % 9 !== 4), 400)),
  });
  letters.onSound((n) => sfx(n));
  const toCss = (x, y) => ({ x: (x * stage.K) / stage.dpr, y: (y * stage.K) / stage.dpr });
  const ui = makeCatchUI({ toCss, skills: () => new Set(ME.skills) });
  const soundLabel = () => { $('sound').textContent = soundOn() ? '♪ on' : '♪ off'; };
  $('sound').onclick = () => { setSound(!soundOn()); soundLabel(); }; soundLabel();

  function fit() { stage.fit(); sky.layout(stage.W, stage.H); letters.resize(stage.W, stage.H); }
  addEventListener('resize', fit);
  fit();
  const cv = $('sky');
  cv.addEventListener('pointerdown', (e) => { cv.setPointerCapture?.(e.pointerId); letters.press(stage.toArt(e)); });
  cv.addEventListener('pointermove', (e) => { const p = stage.toArt(e); letters.move(p); cv.style.cursor = letters.hovering(p) ? 'pointer' : 'default'; });
  addEventListener('pointerup', (e) => letters.release(stage.toArt(e)));
  addEventListener('pointercancel', () => letters.release(null));

  // the jobs: the shared store's, for the made-up CV; if it cannot be read, some made up here
  let lake = [], bottles = [];
  try { const r = await readLake(ME); lake = r.lake || []; bottles = r.bottles || []; } catch (e) { /* made up below */ }
  if (!lake.length) {
    const cos = ['Northwind', 'Bluebird AI', 'Copperleaf', 'Harbor Labs', 'Lumen', 'Quill', 'Tallyho', 'Orbitly', 'Moss & Co', 'Pebble'];
    const sk = ['python', 'sql', 'aws', 'pytorch', 'react', 'go', 'java', 'kubernetes', 'excel', 'llms', 'nlp', 'docker'];
    lake = Array.from({ length: 140 }, (_, i) => ({ id: `demo${i}`, company: cos[i % 10], title: ['ML Engineer', 'AI Engineer', 'Data Scientist', 'Backend Engineer'][i % 4],
      place: 'London', url: '#', posted: Date.now() - (i % 30) * 864e5, skills: Object.fromEntries(sk.filter((_, k) => (i * 7 + k * 3) % 5 < 2).map((k) => [k, 1 + (i % 3)])) }));
  }
  const dream = [...new Set(lake.filter((j) => j.fit != null).sort((a, b) => b.fit - a.fit).map((j) => j.company))].slice(1, 3);   // made up for this page
  letters.start({ W: stage.W, H: stage.H, L: sky.L }, { skills: ME.skills, bottles, auto: false, day: 0.1, dream, gullFirst: 45, gullEvery: 80 });
  sky.draw(letters.view());                                            // once, so the city knows where its roofs are

  // «Try a catch»: each kind shown at once, as if just reeled in
  const any = () => ({ ...lake[Math.floor(Math.random() * lake.length)] });
  const kinds = [['pip', { fit: 30, size: 'small' }], ['★', { fit: 46, size: 'medium' }], ['★★', { fit: 61, size: 'big' }], ['★★★', { fit: 78, size: 'gold' }],
    ['dream', { fit: 64, size: 'big', company: dream[0] || 'Dreamco' }], ['fresh', { fit: 58, size: 'big', posted: Date.now() - 3 * 36e5 }],
    ['perfect', { fit: 52, size: 'medium' }, { perfect: true }], ['gull', { fit: 74, size: 'gold', bottle: true }], ['closed', { fit: 50, size: 'medium' }, { closed: true }]];
  for (const [label, over, opts] of kinds) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = label;
    b.onclick = (e) => { e.stopPropagation(); const j = { ...any(), ...over, id: `try${Math.random()}` }; if (!letters.tryShow(j, opts || {})) say('Busy: one at a time.', 'duck', 1.5); };
    $('try').appendChild(b);
  }

  // the search, played out: the boards read over about seventy seconds, each job found as it comes
  const TOTAL = 2840, order = lake.slice().sort(() => Math.random() - 0.5);
  let fed = 0, read = 0, done = false;
  const prog = () => {
    $('progText').textContent = done ? `Search done · ${letters.F.found.toLocaleString('en-GB')} letters` : `Searching · ${read.toLocaleString('en-GB')} of ${TOTAL.toLocaleString('en-GB')} boards · ${letters.F.found.toLocaleString('en-GB')} letters`;
    $('progBar').style.width = `${Math.round((100 * read) / TOTAL)}%`;
  };
  const search = setInterval(() => {
    if (done) return;
    read = Math.min(TOTAL, read + Math.round(30 + Math.random() * 50));
    const due = Math.round((order.length * read) / TOTAL);
    while (fed < due) letters.feed(order[fed++]);
    if (read >= TOTAL) { done = true; letters.searchDone(); say(`The search is done: ${letters.F.found} letters. The city slows, and stops.`, 'duck', 4); clearInterval(search); }
    prog();
  }, 1000);
  prog();
  say('Hold anywhere and let go to cast. Then wait: a letter will come round your CV.', 'duck', 6);

  // each frame: a step of time, then the picture, then the tag
  let last = performance.now(), avg = 0;
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    const t0 = performance.now();
    if (!(debug && window.sky && window.sky.paused)) letters.step(dt);   // ?debug: sky.paused holds a moment still, to look at it
    const v = letters.view();
    sky.draw(v);
    ui.update(v);
    if (debug) { avg = avg * 0.95 + (performance.now() - t0) * 0.05; $('perf').hidden = false; $('perf').textContent = `${avg.toFixed(1)} ms a frame · K ${stage.K} · ${stage.W}×${stage.H}`; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if (debug) window.sky = { letters, stage, sky, ui, view: () => letters.view(),
    run(sec, dt = 1 / 60) { for (let i = 0; i < sec / dt; i++) letters.step(dt); const v = letters.view(); sky.draw(v); ui.update(v); return letters.F.line && letters.F.line.phase; },
    press(x, y) { return letters.press({ x, y }); }, release(x, y) { letters.release({ x, y }); } };
</script>
</body>
</html>
