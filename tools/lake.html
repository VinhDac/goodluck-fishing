<!doctype html>
<!-- THE LAKE AS STILLS (PLAN.md 17): js/deep.js drawn at one moment, for Vin to approve: waiting for a bite, a golden one
     coming up, a phone. ?t= picks the moment. Open through a local server: /tools/lake.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>The lake, stills</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #05060f; color: #c9d0ff; font-family: "Pixelify Sans", monospace; padding: 16px 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
  .frame { position: relative; }
  canvas.scene { display: block; image-rendering: pixelated; }
  .label { color: #8890b8; font: 13px system-ui, sans-serif; margin: 4px 0 14px; }
  .talk { position: absolute; display: flex; gap: 8px; align-items: center; box-sizing: border-box; padding: 4px 10px; background: #fff8e7; color: #1b1f3a;
    border: 3px solid #3a2a1a; border-radius: 4px; box-shadow: 0 3px 0 #3a2a1a; line-height: 1.2; }
  .talk canvas { width: 32px; height: 32px; image-rendering: pixelated; flex: none; background: #9fd4f8; border: 2px solid #3a2a1a; }
</style>
</head>
<body>
<div class="row" id="lake"></div>
<script type="module">
  import { makeDeep } from '../js/deep.js';
  const t = +(new URLSearchParams(location.search).get('t') || 3.2);
  function lake(W, H, K, label, variant, say) {
    const box = document.createElement('div'), fr = document.createElement('div'); fr.className = 'frame';
    const cv = document.createElement('canvas'); cv.className = 'scene'; cv.width = W; cv.height = H; cv.style.width = W * K + 'px'; cv.style.height = H * K + 'px';
    fr.appendChild(cv); box.appendChild(fr);
    const lab = document.createElement('div'); lab.className = 'label'; lab.textContent = label; box.appendChild(lab);
    document.getElementById('lake').appendChild(box);
    const s = makeDeep(cv.getContext('2d')), L = s.layout(W, H);
    for (let k = 0; k < 3; k++) s.draw(W, H, t + k * 0.05, s.demo(t + k * 0.05, variant));       // a few frames, so the city knows its roofs
    const talk = document.createElement('div'); talk.className = 'talk';
    talk.innerHTML = `<canvas width="16" height="16"></canvas><span>${say}</span>`;
    Object.assign(talk.style, { left: L.talk.x * K + 'px', top: L.talk.y * K + 'px', width: L.talk.w * K + 'px', height: L.talk.h * K + 'px', fontSize: Math.max(12, Math.round(K * 4.4)) + 'px' });
    fr.appendChild(talk);
    const face = talk.querySelector('canvas').getContext('2d');
    face.fillStyle = '#ffd84a'; face.beginPath(); face.arc(8, 8, 6, 0, 7); face.fill(); face.fillStyle = '#f2802a'; face.fillRect(12, 8, 4, 2); face.fillStyle = '#1b1f3a'; face.fillRect(9, 5, 1, 2);
  }
  lake(384, 216, 4, 'A computer: waiting for a bite', 'wait', 'Something is nibbling the bait… wait for it.');
  lake(384, 216, 4, 'A computer: a golden one, coming up', 'fight', 'A golden one! Let go when it pulls.');
  lake(195, 422, 2, 'A phone', 'wait', 'Something is nibbling… wait for it.');
</script>
</body>
</html>
